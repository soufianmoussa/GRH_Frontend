<!-- Layout principal (Topbar + Sidebar) — uniquement pour un utilisateur authentifié -->
<div *ngIf="showMainLayout()" class="app-wrapper">

  <app-topbar (toggleSidebar)="sidebarOpened = !sidebarOpened"></app-topbar>

  <div class="main-layout">
    <app-sidebar [opened]="sidebarOpened"></app-sidebar>

    <div class="main-content" [class.sidebar-open]="sidebarOpened">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>

<!-- Vérification de session en cours : on n'affiche pas encore le menu (évite le flash) -->
<div *ngIf="showAuthChecking()" class="app-auth-checking">
  <i class="pi pi-spin pi-spinner"></i>
</div>

<!-- Pages publiques / auth / onboarding (sans layout admin) -->
<div *ngIf="showPublicOutlet()">
  <router-outlet></router-outlet>
</div>

<!-- Assistant IA flottant (visible uniquement dans l'app authentifiée) -->
<app-chatbot *ngIf="showChatbot()"></app-chatbot>
