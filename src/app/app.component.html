<!-- Layout principal (Topbar + Sidebar) -->
<div *ngIf="!isPublicLayoutPage()" class="app-wrapper">

  <app-topbar (toggleSidebar)="sidebarOpened = !sidebarOpened"></app-topbar>

  <div class="main-layout">
    <app-sidebar [opened]="sidebarOpened"></app-sidebar>

    <div class="main-content" [class.sidebar-open]="sidebarOpened">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>

<!-- Pages publiques / auth (sans layout admin) -->
<div *ngIf="isPublicLayoutPage()">
  <router-outlet></router-outlet>
</div>

<!-- Assistant IA flottant (visible uniquement dans l'app authentifiée) -->
<app-chatbot *ngIf="showChatbot()"></app-chatbot>
