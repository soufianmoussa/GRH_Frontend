<p-toast position="top-center"></p-toast>

<div class="content agent-onboarding-complete">
  <div class="page-header">
    <div>
      <a routerLink="/onboarding/waiting" class="back-link"><i class="pi pi-arrow-left"></i> Retour</a>
      <h1 class="titleh1">Completer mon profil</h1>
      <p>Completez les informations et documents demandes avant soumission a l administration.</p>
    </div>
  </div>

  <div *ngIf="loading" class="card loading-card">Chargement du formulaire onboarding...</div>

  <div class="card" *ngIf="!loading && onboarding">
    <app-onboarding-stepper
      [onboarding]="onboarding"
      actor="agent"
      [saving]="saving"
      (profileSave)="saveProfile($event)"
      (documentUpload)="uploadDocument($event)"
      (dossierSubmit)="submitDossier()">
    </app-onboarding-stepper>
  </div>
</div>
