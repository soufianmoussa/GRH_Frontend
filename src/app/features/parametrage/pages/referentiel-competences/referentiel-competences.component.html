<p-toast position="top-center"></p-toast>
<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

<div class="content">
  <h1 class="titleh1">Référentiel des compétences</h1>

  <div class="mb-3 grpSelect">
    <p-floatLabel>
      <p-dropdown
        id="groupe_select"
        [options]="groupes"
        [(ngModel)]="selectedGroupeId"
        optionLabel="name"
        optionValue="id"
        (onChange)="onGroupeChange()"
        styleClass="w-15rem"
        appendTo="body"
      ></p-dropdown>
      <label for="groupe_select">Choisir un groupe</label>
    </p-floatLabel>
  </div>

  <div class="card">
    <div class="container primTable">

      <div class="flex justify-content-between align-items-center mb-3">
        <h3>
          <i class="pi pi-star" style="font-size: 28px; margin-right: 6px;"></i>
          Liste des compétences
        </h3>

        <p-button
          label="Ajouter une compétence"
          icon="pi pi-plus"
          styleClass="p-button-success"
          (onClick)="showAddDialog()"
          [disabled]="!selectedGroupeId"
        ></p-button>
      </div>

      <p-table
        #dtCompetence
        [value]="competences"
        [rows]="pageSize"
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [responsiveLayout]="'scroll'"
        [globalFilterFields]="['competence', 'description']"
        [loading]="loading"
        [lazy]="true"
        [totalRecords]="totalRecords"
        (onPage)="onPageChange($event)"
      >

        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            <p-button
              label="Effacer"
              [outlined]="true"
              icon="pi pi-filter-slash"
              (onClick)="clearCompetences(dtCompetence)"
            ></p-button>

            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input
                #searchBox
                pInputText
                type="text"
                [(ngModel)]="searchCompetence"
                (input)="dtCompetence.filterGlobal(searchCompetence, 'contains'); applySearch();"
                placeholder="Rechercher..."
              />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th><p-columnFilter type="text" field="competence" display="menu"></p-columnFilter>Compétence</th>
            <th><p-columnFilter type="text" field="description" display="menu"></p-columnFilter>Description</th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr>
            <td><strong>{{ item.competence }}</strong></td>
            <td>{{ item.description }}</td>

            <td class="actions-cell">
              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-text p-button-success mr-2"
                pTooltip="Visualiser"
                (click)="onViewCompetence(item)"
              ></button>

              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-info mr-2"
                pTooltip="Modifier"
                (click)="onEditCompetence(item)"
              ></button>

              <button
                pButton
                icon="pi pi-trash"
                class="p-button-rounded p-button-text p-button-danger"
                pTooltip="Supprimer"
                (click)="onDeleteCompetence(item)"
              ></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr><td colspan="3" class="text-center">Aucune compétence trouvée.</td></tr>
        </ng-template>

      </p-table>
    </div>
  </div>
</div>

<p-dialog
  styleClass="pdialogfon"
  header="Détails de la compétence"
  [(visible)]="displayView"
  [modal]="true"
  [style]="{ width: '450px' }"
>
  <ng-container *ngIf="selectedCompetence">
    <div class="p-fluid mt-4 flex flex-column gap-4">
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_comp" [ngModel]="selectedCompetence.competence" [disabled]="true" />
          <label for="v_comp">Compétence</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatLabel>
          <textarea pInputTextarea id="v_desc" [ngModel]="selectedCompetence.description" rows="4" [disabled]="true"></textarea>
          <label for="v_desc">Description</label>
        </p-floatLabel>
      </div>
    </div>
  </ng-container>
  <ng-template pTemplate="footer">
    <p-button label="Fermer" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayView=false"></p-button>
  </ng-template>
</p-dialog>

<p-dialog
  styleClass="pdialogfon"
  header="Ajouter une compétence"
  [(visible)]="displayAdd"
  [modal]="true"
  [style]="{ width: '550px' }"
>
  <div class="p-fluid mt-4 flex flex-column gap-4">
    <div class="w-full">
      <p-floatLabel>
        <input pInputText id="a_comp" [(ngModel)]="newCompetence.competence" />
        <label for="a_comp">Compétence <span style="color: red;">*</span></label>
      </p-floatLabel>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Ajouter" icon="pi pi-check" severity="success" (onClick)="createCompetence()"></p-button>
    <p-button label="Annuler" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayAdd=false"></p-button>
  </ng-template>
</p-dialog>

<p-dialog
  styleClass="pdialogfon"
  header="Modifier une compétence"
  [(visible)]="displayEdit"
  [modal]="true"
  [style]="{ width: '550px' }"
>
  <div class="p-fluid mt-4 flex flex-column gap-4" *ngIf="editCompetence">
    <div class="w-full">
      <p-floatLabel>
        <input pInputText id="e_comp" [(ngModel)]="editCompetence.competence" />
        <label for="e_comp">Compétence <span style="color: red;">*</span></label>
      </p-floatLabel>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Modifier" icon="pi pi-check" severity="success" (onClick)="updateCompetence()" [disabled]="loading"></p-button>
    <p-button label="Annuler" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayEdit=false"></p-button>
  </ng-template>
</p-dialog>
