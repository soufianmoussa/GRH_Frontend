<div class="content">
  <p-toast position="top-center"></p-toast>

  <h1 class="titleh1">Historique des Actes</h1>
  <app-agentcard></app-agentcard>

  <div class="card">
    <div class="container primTable">
      <p-table
        #dtHistorique
        [value]="historiqueActes"
        [loading]="loading"
        [rows]="3"
        [paginator]="true"
        [rowsPerPageOptions]="[3, 5, 10]"
        [responsiveLayout]="'scroll'"
        [globalFilterFields]="['acte', 'date']"
      >

        <ng-template pTemplate="caption">
          <div class="flex ">
            <p-button
              label="Effacer"
              [outlined]="true"
              icon="pi pi-filter-slash"
              (onClick)="clear(dtHistorique)"
            ></p-button>

            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>

              <input
                #searchBox
                pInputText
                type="text"
                [(ngModel)]="searchText"
                (input)="dtHistorique.filterGlobal(searchBox.value, 'contains')"
                placeholder="Rechercher..."
              />
            </span>
          </div>
        </ng-template>


        <ng-template pTemplate="header">
          <tr>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="acte" display="menu" />
                Acte
              </div>
            </th>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="date" display="menu" />
                Date
              </div>
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>


        <ng-template pTemplate="body" let-item>
          <tr>
            <td>{{ item.acte }}</td>
            <td>{{ item.date }}</td>
            <td>
              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-text p-button-success mr-2"
                pTooltip="Visualiser"
                tooltipPosition="top"
                (click)="onViewActe(item)"
              ></button>

            </td>
          </tr>
        </ng-template>


        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center">Aucune donnée trouvée.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>


<p-dialog
  styleClass="pdialogfon"
  header="Détails de l'acte"
  [(visible)]="displayDialog"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '550px' }"
>
  <ng-container *ngIf="selectedActe">
    <div class="p-fluid mt-4 flex flex-column gap-4 pdialogfon2">
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_acte" [ngModel]="selectedActe.acte" [disabled]="true" />
          <label for="v_acte">Acte</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_date" [ngModel]="selectedActe.date" [disabled]="true" />
          <label for="v_date">Date</label>
        </p-floatLabel>
      </div>
    </div>
  </ng-container>
  <ng-template pTemplate="footer">
    <p-button label="Fermer" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialog=false"></p-button>
  </ng-template>
</p-dialog>
