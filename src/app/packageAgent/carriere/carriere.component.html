<div class="content">
  <p-toast position="top-center"></p-toast>

  <h1 class="titleh1">Situation Fonctionnelle</h1>

  <app-agentcard></app-agentcard>

  <div class="card">
    <div class="container primTable">
      <p-table
        #dtFonctionnelle
        [value]="situationFonctionnelle"
        [loading]="loading"
        [rows]="3"
        [paginator]="true"
        [rowsPerPageOptions]="[3, 5, 10]"
        [responsiveLayout]="'scroll'"
        [globalFilterFields]="['Grade', 'Corps', 'Echelle', 'DateDebut']"
      >

        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            <p-button
              label="Effacer"
              [outlined]="true"
              icon="pi pi-filter-slash"
              (onClick)="clearFonctionnelle(dtFonctionnelle)"
            ></p-button>

            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input
                #searchBoxFonctionnelle
                pInputText
                type="text"
                [(ngModel)]="searchFonctionnelle"
                (input)="dtFonctionnelle.filterGlobal(searchBoxFonctionnelle.value, 'contains')"
                placeholder="Rechercher..."
              />
            </span>
          </div>
        </ng-template>


        <ng-template pTemplate="header">
          <tr>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="Grade" display="menu" />
                Grade
              </div>
            </th>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="Corps" display="menu" />
                Corps
              </div>
            </th>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="Echelle" display="menu" />
                Échelle
              </div>
            </th>
            <th>
              <div class="flex align-items-center">
                <p-columnFilter type="text" field="DateDebut" display="menu" />
                Date début
              </div>
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>


        <ng-template pTemplate="body" let-item>
          <tr>
            <td>{{ item.Grade }}</td>
            <td>{{ item.Corps }}</td>
            <td>{{ item.Echelle }}</td>
            <td>{{ item.DateDebut }}</td>
            <td>
              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-text p-button-success mr-2"
                pTooltip="Visualiser"
                tooltipPosition="top"
                (click)="onViewFonctionnelle(item)"
              ></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center">Aucune donnée trouvée.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>


<p-dialog
  styleClass="pdialogfon"
  header="Détails de la situation fonctionnelle"
  [(visible)]="displayDialogFonctionnelle"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '550px' }"
>
  <ng-container *ngIf="selectedFonctionnelle">
    <div class="p-fluid mt-4 flex flex-column gap-4 pdialogfon2">
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_grade" [ngModel]="selectedFonctionnelle.Grade" [disabled]="true" />
          <label for="v_grade">Grade</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_corps" [ngModel]="selectedFonctionnelle.Corps" [disabled]="true" />
          <label for="v_corps">Corps</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_echelle" [ngModel]="selectedFonctionnelle.Echelle" [disabled]="true" />
          <label for="v_echelle">Échelle</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatLabel>
          <input pInputText id="v_dateDebut" [ngModel]="selectedFonctionnelle.DateDebut" [disabled]="true" />
          <label for="v_dateDebut">Date début</label>
        </p-floatLabel>
      </div>
    </div>
  </ng-container>
  <ng-template pTemplate="footer">
    <p-button label="Fermer" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialogFonctionnelle=false"></p-button>
  </ng-template>
</p-dialog>
